<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Club Nova</title>
</head>
<body>
  <div id="topBar">
    <div class="left">
      <div class="avatarWrap">
        <div class="avatar">🪩</div>
        <div class="levelBadge" id="levelVal">1</div>
      </div>
      <div class="xpWrap">
        <div class="xpLabel">Fans to next level</div>
        <div class="xpBarOuter"><div class="xpBarFill" id="xpBarFill"></div></div>
      </div>
      <div class="cashPill"><div class="cashIcon">$</div><span class="amount" id="cashVal">500</span></div>
    </div>
    <div class="right">
      <div class="statPill fans">
        <div class="statIcon">★</div>
        <div class="value"><span id="fansVal">0</span></div>
        <div class="labelSmall">Fans</div>
      </div>
      <div class="statPill placed">
        <div class="statIcon">▣</div>
        <div class="value" id="placedVal">0/0</div>
        <div class="labelSmall">Patrons</div>
      </div>
    </div>
  </div>

  <div id="toast"></div>
  <div id="hint">Click to place &nbsp;•&nbsp; Right-click to sell &nbsp;•&nbsp; R: rotate &nbsp;•&nbsp; Esc/re-click to deselect &nbsp;•&nbsp; Drag to pan</div>

  <div id="selectedChip"></div>
  <div id="shopToggle" title="Open shop"><span class="icon">🛍️</span><span>Shop</span></div>
  <div id="muteButton" title="Toggle sound">🔊</div>

  <div id="shopOverlay">
    <div id="shopPanel">
      <div class="shopHeader">
        <div id="shopTabs"></div>
        <div id="shopClose" title="Close">✕</div>
      </div>
      <div id="shopItems"></div>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
