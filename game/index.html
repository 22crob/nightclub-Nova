<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Club Nova</title>
</head>
<body>
  <!-- Top-left: portrait, level star, experience bar, small utility buttons -->
  <div id="hudProfile">
    <div class="portrait">
      <div class="portraitFace">🪩</div>
      <div class="levelStar"><span id="levelVal">1</span></div>
    </div>
    <div class="profileRight">
      <div class="xpBar">
        <div class="xpFill" id="xpBarFill"></div>
        <div class="xpText" id="xpText">Level 1</div>
      </div>
      <div class="utilityRow">
        <div id="muteButton" class="squareButton" title="Sound on/off">🔊</div>
        <div id="zoomIn" class="squareButton" title="Zoom in">＋</div>
        <div id="zoomOut" class="squareButton" title="Zoom out">－</div>
      </div>
    </div>
  </div>

  <!-- Top-centre: cash -->
  <div id="hudCash">
    <div class="cashStack"><span>$</span></div>
    <span class="amount" id="cashVal">500</span>
  </div>

  <!-- Top-right: stat buttons -->
  <div id="hudStats">
    <div class="statButton" title="Fans">
      <div class="statValue"><span class="statIcon">★</span><span id="fansVal">0</span></div>
      <div class="statLabel">Fans</div>
    </div>
    <div class="statButton" title="Patrons in the club / capacity">
      <div class="statValue"><span class="statIcon">☺</span><span id="placedVal">0/0</span></div>
      <div class="statLabel">Patrons</div>
    </div>
  </div>

  <div id="toast"></div>

  <!-- Bottom-left: tips box -->
  <div id="hint">
    <div class="hintTitle">Tips</div>
    Click to place • Right-click to sell • R to rotate • Esc to put down • Drag to move around • Scroll to zoom
  </div>

  <!-- Bottom-centre: what you're holding, and the toolbar -->
  <div id="selectedChip"></div>
  <div id="toolbar">
    <div id="shopToggle" class="toolButton" title="Buy furniture">
      <div class="toolIcon">🛍️</div><div class="toolLabel">Shop</div>
    </div>
    <div id="decorateButton" class="toolButton" title="Floors and decorations">
      <div class="toolIcon">🪣</div><div class="toolLabel">Decorate</div>
    </div>
    <div id="expandButton" class="toolButton" title="Make the club bigger">
      <div class="toolIcon">📐</div><div class="toolLabel">Expand</div>
    </div>
    <div id="staffButton" class="toolButton" title="Hire staff">
      <div class="toolIcon">🧑‍🍳</div><div class="toolLabel">Staff</div>
    </div>
  </div>

  <div id="shopOverlay">
    <div id="shopPanel">
      <div class="shopHeader">
        <div id="shopTabs"></div>
        <div id="shopClose" title="Close">✕</div>
      </div>
      <div id="shopItems"></div>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
